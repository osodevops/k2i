[workspace]
members = ["cargo:."]

# Config for 'dist'
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.30.2"
# Allow custom modifications to CI workflow files
allow-dirty = ["ci"]
# CI backends to support
ci = "github"
# The installers to generate for each app
installers = ["shell", "homebrew"]
# Target platforms to build apps for (Rust target-triple syntax)
# Note: aarch64-unknown-linux-gnu removed - requires ARM runners not available for private repos
# Note: x86_64-pc-windows-msvc removed - OpenSSL dependencies are complex on Windows
targets = ["aarch64-apple-darwin", "x86_64-apple-darwin", "x86_64-unknown-linux-gnu"]
# Path that installers should place binaries in
install-path = "CARGO_HOME"
# Where to host releases
hosting = "github"
# Whether to install an updater program
install-updater = false
# Homebrew tap repository for publishing formulas
tap = "osodevops/homebrew-tap"
# Custom formula name
formula = "k2i"
# Publish jobs to run (updates homebrew tap automatically)
publish-jobs = ["homebrew"]

# System dependencies required for building.
#
# rdkafka-sys bundles librdkafka, which is compiled from source and linked
# statically. librdkafka enables OAUTHBEARER OIDC, whose rdkafka_conf.c does
# `#ifdef WITH_OAUTHBEARER_OIDC / #include <curl/curl.h>`, so libcurl headers
# are mandatory on Linux. macOS gets curl from the SDK, which is why only the
# Linux target needs it spelled out here.
#
# Keep this list in sync with the apt installs in .github/workflows/*.yml —
# scripts/check-workflow-deps.sh enforces that.
[dist.dependencies.apt]
cmake = { version = "*", targets = ["x86_64-unknown-linux-gnu"] }
libcurl4-openssl-dev = { version = "*", targets = ["x86_64-unknown-linux-gnu"] }
libsasl2-dev = { version = "*", targets = ["x86_64-unknown-linux-gnu"] }
libssl-dev = { version = "*", targets = ["x86_64-unknown-linux-gnu"] }
pkg-config = { version = "*", targets = ["x86_64-unknown-linux-gnu"] }

[dist.dependencies.homebrew]
cmake = { version = "*", targets = ["x86_64-apple-darwin", "aarch64-apple-darwin"] }
openssl = { version = "*", targets = ["x86_64-apple-darwin", "aarch64-apple-darwin"] }
pkg-config = { version = "*", targets = ["x86_64-apple-darwin", "aarch64-apple-darwin"] }
